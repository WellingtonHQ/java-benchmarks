services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    command:
      - postgres
      - -c
      - max_connections=1100
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=1MB
    ports:
      - "127.0.0.1:${BENCHMARK_DB_PORT:-5433}:5432"
    shm_size: 1gb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init/001-create-table.sql:/docker-entrypoint-initdb.d/001-create-table.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"]
      interval: 2s
      timeout: 2s
      retries: 60

volumes:
  postgres-data:
