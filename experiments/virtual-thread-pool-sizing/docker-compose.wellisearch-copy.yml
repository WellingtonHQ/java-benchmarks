services:
  wellisearch-copy:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: wellisearch_benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark-copy-only
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_cache_size=6GB
    cpus: 4
    mem_limit: 8g
    shm_size: 2gb
    ports:
      - "127.0.0.1:${WELLISEARCH_COPY_DB_PORT:-5434}:5432"
    volumes:
      - wellisearch-copy-data:/var/lib/postgresql
      - ./db/clone/001-enable-extensions.sql:/docker-entrypoint-initdb.d/001-enable-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d wellisearch_benchmark"]
      interval: 2s
      timeout: 2s
      retries: 60

volumes:
  wellisearch-copy-data:
